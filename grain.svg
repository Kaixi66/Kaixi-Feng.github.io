<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384">
  <filter id="paper" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".76" numOctaves="3" seed="14" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="2.8" intercept="-.9"/>
      <feFuncG type="linear" slope="2.8" intercept="-.9"/>
      <feFuncB type="linear" slope="2.8" intercept="-.9"/>
      <feFuncA type="table" tableValues="1 1"/>
    </feComponentTransfer>
  </filter>
  <rect width="384" height="384" filter="url(#paper)"/>
</svg>
